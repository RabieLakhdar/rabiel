    </text>
    <text x="1024" y="0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="700" fill="#38bdf8">https://rabiel.dev</text>
  </g>
