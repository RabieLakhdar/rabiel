<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Rabie Lakhdar - Senior React Native &amp; Full-Stack TypeScript Engineer - rabiel.dev">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#132038" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="subtleGlow" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Surface -->
  <rect width="1200" height="630" fill="url(#canvasBg)" />
  <rect width="1200" height="630" fill="url(#subtleGlow)" />

  <!-- Top Accent Rule -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentLine)" />

  <!-- Outer Architectural Frame -->
  <rect x="44" y="40" width="1112" height="550" rx="20" fill="#0f172a" fill-opacity="0.55" stroke="#1e293b" stroke-width="2" />

  <!-- Header Row: RL Monogram + Availability -->
  <g transform="translate(88, 84)">
    <rect width="56" height="56" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="28" y="36" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">RL</text>
    <rect x="16" y="43" width="24" height="3" rx="1.5" fill="#38bdf8" />

    <text x="74" y="26" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">rabiel.dev</text>
    <text x="74" y="47" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="500" fill="#94a3b8">Senior Consultant • Maltem Africa</text>

    <!-- Availability Pill on Top Right -->
    <g transform="translate(604, 8)">
      <rect width="424" height="40" rx="20" fill="#064e3b" fill-opacity="0.45" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.5" />
      <circle cx="22" cy="20" r="5" fill="#34d399" />
      <text x="38" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" fill="#d1fae5">INTERNATIONAL REMOTE • CET / GMT+1</text>
    </g>
  </g>

  <!-- Main Name & Title -->
  <g transform="translate(88, 224)">
    <text x="0" y="0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-1.8">Rabie Lakhdar</text>
    <text x="0" y="62" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="600" fill="#38bdf8" letter-spacing="-0.6">Senior React Native &amp; Full-Stack TypeScript Engineer</text>
    <text x="0" y="114" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="400" fill="#cbd5e1">8+ years architecting high-trust Mobile (iOS &amp; Android) and Web platforms for Banking, Insurance &amp; SaaS.</text>
  </g>

  <!-- Core Stack Pills -->
  <g transform="translate(88, 388)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="600" fill="#e2e8f0">
    <g transform="translate(0, 0)">
      <rect width="154" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="77" y="25" text-anchor="middle">React Native</text>
    </g>
    <g transform="translate(170, 0)">
      <rect width="136" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="68" y="25" text-anchor="middle">TypeScript</text>
    </g>
    <g transform="translate(322, 0)">
      <rect width="174" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="87" y="25" text-anchor="middle">React &amp; Next.js</text>
    </g>
    <g transform="translate(512, 0)">
      <rect width="186" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="93" y="25" text-anchor="middle">Node.js &amp; APIs</text>
    </g>
    <g transform="translate(714, 0)">
